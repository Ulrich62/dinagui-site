INSTRUCTIONS D'INSTALLATION SUR OUTLOOK :
1. Ouvrez ce fichier HTML dans votre navigateur web (Chrome, Edge, Safari...).
2. Appuyez sur Ctrl+A (ou Cmd+A sur Mac) pour tout sélectionner.
3. Appuyez sur Ctrl+C (ou Cmd+C sur Mac) pour copier.
4. Allez dans les paramètres de signature d'Outlook.
5. Créez une nouvelle signature et collez (Ctrl+V ou Cmd+V) le contenu dans la zone de texte.
6. Enregistrez !
-->
